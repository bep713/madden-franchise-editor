name: Build and test
description: npm ci, unit tests, renderer build and Playwright e2e. Leaves node_modules and the built renderer in place for packaging.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci
      shell: bash
    - run: npm run test:unit
      shell: bash
    - run: npm run sass:build
      shell: bash
    - run: npm run build:renderer
      shell: bash
    # windows-latest has a desktop session, so Electron windows open without xvfb.
    - run: npx playwright test
      shell: bash

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          tests/output/playwright-report
          test/playwright-test-results
        retention-days: 14

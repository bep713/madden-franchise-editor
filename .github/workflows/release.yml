name: Release

on:
  push:
    branches: [release]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fail if release tag already exists
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "Tag v$VERSION already exists. Bump the version in package.json before releasing."
            exit 1
          fi

      # Tests and the installer share one job so npm ci and the renderer build run once.
      - uses: ./.github/actions/build-and-test

      # electron-builder's own publishing can race and split the assets across two
      # draft releases, so build only and upload with gh, as nightly.yml does.
      - name: Build installer
        shell: bash
        run: npx electron-builder -w --publish never

      - name: Verify latest.yml
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test -f dist/latest.yml || { echo "dist/latest.yml is missing"; exit 1; }
          cat dist/latest.yml
          grep -q "^version: $VERSION$" dist/latest.yml || { echo "latest.yml version does not match $VERSION"; exit 1; }
          for f in $(grep -E '^\s*(-\s*url|path):' dist/latest.yml | awk '{print $NF}' | sort -u); do
            test -f "dist/$f" || { echo "latest.yml references $f but dist/$f does not exist"; ls dist; exit 1; }
            test -f "dist/$f.blockmap" || { echo "Missing dist/$f.blockmap"; ls dist; exit 1; }
          done

      # Creates a draft release for v<version>; review and publish it by hand.
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml

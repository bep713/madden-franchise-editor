name: Release

on:
  push:
    branches: [release]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fail if release tag already exists
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "Tag v$VERSION already exists. Bump the version in package.json before releasing."
            exit 1
          fi

      # Tests and the installer share one job so npm ci and the renderer build run once.
      - uses: ./.github/actions/build-and-test

      # Creates a draft release for v<version>; review and publish it by hand.
      - name: Build and publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder -w --publish always
